[project]
name = "edi-assistant"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "PySide6>=6.7",
  "playwright>=1.45",
  "openpyxl>=3.1",
  "pyyaml>=6.0",
  "httpx>=0.27",
  "pypdf>=4.2",
]
[project.optional-dependencies]
dev = ["pytest>=8", "pytest-qt>=4.4", "pyinstaller>=6.6"]

[tool.pytest.ini_options]
testpaths = ["tests"]
qt_api = "pyside6"
markers = ["e2e: launches a browser against the mock site"]
